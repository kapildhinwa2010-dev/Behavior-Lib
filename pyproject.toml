[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Behavior-Lib"
version = "1.0.0"
description = "Behavior library"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Kapil Dhinwa"}]

[project.urls]
Homepage = "https://github.com/kapildhinwa2010-dev/Behavior-Lib"

[tool.setuptools]
packages = ["behavior_lib"]
